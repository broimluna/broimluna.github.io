<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | CP Island</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">CP Island</div>
      </div>
    </div>
<script>
  var canvas = document.querySelector("#unity-canvas");

  function unityShowBanner(msg, type) {
    var warningBanner = document.querySelector("#unity-warning");
    function updateBannerVisibility() {
      warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }
    var div = document.createElement('div');
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type == 'error') div.style = 'background: red; padding: 10px;';
    else {
      if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
      setTimeout(function() {
        warningBanner.removeChild(div);
        updateBannerVisibility();
      }, 5000);
    }
    updateBannerVisibility();
  }

  // --- START SPLIT LOADING LOGIC ---
  var buildUrl = "Build";
  
  // Update these to match your 7 parts from the PowerShell output
  const dataParts = [
    buildUrl + "/parts/test3.data.unityweb.part00",
    buildUrl + "/parts/test3.data.unityweb.part01",
    buildUrl + "/parts/test3.data.unityweb.part02",
    buildUrl + "/parts/test3.data.unityweb.part03",
    buildUrl + "/parts/test3.data.unityweb.part04",
    buildUrl + "/parts/test3.data.unityweb.part05",
    buildUrl + "/parts/test3.data.unityweb.part06",
    buildUrl + "/parts/test3.data.unityweb.part07",
    buildUrl + "/parts/test3.data.unityweb.part08",
    buildUrl + "/parts/test3.data.unityweb.part09",
    buildUrl + "/parts/test3.data.unityweb.part10",
    buildUrl + "/parts/test3.data.unityweb.part11",
    buildUrl + "/parts/test3.data.unityweb.part12",
    buildUrl + "/parts/test3.data.unityweb.part13",
    buildUrl + "/parts/test3.data.unityweb.part14",
    buildUrl + "/parts/test3.data.unityweb.part15",
    buildUrl + "/parts/test3.data.unityweb.part16",
    buildUrl + "/parts/test3.data.unityweb.part17",
    buildUrl + "/parts/test3.data.unityweb.part18",
    buildUrl + "/parts/test3.data.unityweb.part19",
    buildUrl + "/parts/test3.data.unityweb.part20",
    buildUrl + "/parts/test3.data.unityweb.part21",
    buildUrl + "/parts/test3.data.unityweb.part22",
    buildUrl + "/parts/test3.data.unityweb.part23",
    buildUrl + "/parts/test3.data.unityweb.part24",
    buildUrl + "/parts/test3.data.unityweb.part25",
    buildUrl + "/parts/test3.data.unityweb.part26",
    buildUrl + "/parts/test3.data.unityweb.part27",
    buildUrl + "/parts/test3.data.unityweb.part28",
    buildUrl + "/parts/test3.data.unityweb.part29",
    buildUrl + "/parts/test3.data.unityweb.part30",
  ];

  async function loadSplitData(parts, progressCallback) {
    const chunks = [];
    let totalLength = 0;
    let loadedLength = 0;

    // Fetch and track progress for each chunk
    for (const url of parts) {
      const response = await fetch(url);
      const buf = await response.arrayBuffer();
      chunks.push(new Uint8Array(buf));
      totalLength += buf.byteLength;
    }

    // Stitch chunks together
    const mergedArray = new Uint8Array(totalLength);
    let offset = 0;
    for (const chunk of chunks) {
      mergedArray.set(chunk, offset);
      offset += chunk.length;
    }

    // Create a Blob URL for Unity to consume
    return URL.createObjectURL(new Blob([mergedArray], { type: 'application/octet-stream' }));
  }
  // --- END SPLIT LOADING LOGIC ---

  var loaderUrl = buildUrl + "/test3.loader.js";
  var config = {
    arguments: [],
    dataUrl: "", // This will be filled by the loadSplitData function
    frameworkUrl: buildUrl + "/test3.framework.js.unityweb",
    codeUrl: buildUrl + "/test3.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "OpenCPI",
    productName: "CP Island",
    productVersion: "1.13.1",
    showBanner: unityShowBanner,
  };

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    document.querySelector("#unity-container").className = "unity-mobile";
    canvas.className = "unity-mobile";
  } else {
    canvas.style.width = "960px";
    canvas.style.height = "600px";
  }

  document.querySelector("#unity-loading-bar").style.display = "block";

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    // We call our split loader BEFORE initializing the Unity instance
    loadSplitData(dataParts).then((finalDataUrl) => {
      config.dataUrl = finalDataUrl; // Set the stitched URL to config

      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((message) => {
        alert(message);
      });
    });
  };

  document.body.appendChild(script);
</script>
  </body>
</html>
